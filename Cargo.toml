[package]
name = "rust_key_sequencer"
version = "1.0.0"
edition = "2021"
authors = ["rkohnmn"]
description = "A high-performance GUI keyboard and mouse macro sequencer built in Rust"
license = "MIT"
repository = "https://github.com/rkohnmn/rust-key-sequencer"
readme = "README.md"
keywords = ["macro", "autoclicker", "key-sequencer", "automation", "rust"]

[dependencies]
eframe = "0.29"
enigo = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
